GRAPH_GENERATION:
  sim_measure:
    - 'phs'
    - 'rho'
    - 'euclidean'
    - 'braycurtis'
    - 'cosine'
    - 'spearman'
    - 'correlation'  #pearson correlation 


  neighbors:    #define list with some fixed step 
    start: 3
    end: 100
    step: 1
  graph_method:
    - 'umap'
    - 'gauss'
    - 'jaccard_phenograph'
    - 'jaccard_seurat'

CLUSTERING:
  leiden:
    res:
      start: 0.001
      stop: 2
      step: 0.02
    partition_type:
      - RBConfigurationVertexPartition
      - CPMVertexPartition
      - RBERVertexPartition
  louvain:
    res:
      start: 0.001
      stop: 2
      step: 0.02
    partition_type:
      - RBConfigurationVertexPartition
      - CPMVertexPartition
      - RBERVertexPartition
